name: Lightweight Python checks

on:
  # Documentation-only edits do not require a Python test run.
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # Match the version-pinned MCio/CBOR dependencies used by development.
      - name: Install project test dependencies
        run: python -m pip install -r requirements.txt
      # Neural tests perform real CPU model updates and checkpoint checks.
      # Install the CPU wheel only; GitHub runners do not need CUDA libraries.
      - name: Install CPU PyTorch for neural tests
        run: python -m pip install 'torch==2.15.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Check Python syntax
        run: python -m compileall -q experiments src/gmaincraft tests
      - name: Run unit tests
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python -m unittest discover -s tests -v
