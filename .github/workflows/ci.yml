name: Lightweight Python checks

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pure-policy test dependency
        run: python -m pip install 'numpy>=2,<3'
      - name: Check Python syntax
        run: python -m compileall -q experiments src/gmaincraft tests
      - name: Run policy math tests
        run: python -m unittest discover -s tests -v
