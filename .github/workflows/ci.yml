name: Lightweight Python checks

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Use the same pinned controller/CBOR stack as local development.
      # NumPy alone cannot import MCio-backed modules in the unit suite.
      - name: Install project test dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q experiments src/gmaincraft tests
      - name: Run policy math tests
        run: python -m unittest discover -s tests -v
